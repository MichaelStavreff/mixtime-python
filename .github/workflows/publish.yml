name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (for example v0.1.1)"
        required: true
        type: string
      publish:
        description: "Upload to PyPI (uncheck for a build-only run)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  REF_NAME: ${{ github.event.inputs.ref || github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Check the tag matches the package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["REF_NAME"].removeprefix("v")
          text = pathlib.Path("python/pyproject.toml").read_text()
          version = re.search(r'^version = "([^"]+)"', text, re.M).group(1)
          if tag != version:
              sys.exit(f"tag {tag!r} does not match package version {version!r}")
          print(f"publishing mixtime {version}")
          PY

  linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          manylinux: "2014"
          command: build
          args: >-
            --release --out dist --compatibility pypi
            -i python3.12

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: python/dist/*.whl

  macos-arm64:
    needs: check-version
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: build
          args: --release --out dist --compatibility pypi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: python/dist/*.whl

  macos-x86_64:
    needs: check-version
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: build
          args: --release --out dist --compatibility pypi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: python/dist/*.whl

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: build
          args: --release --out dist --compatibility pypi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: python/dist/*.whl

  sdist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  publish:
    needs: [linux, macos-arm64, macos-x86_64, windows, sdist]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
