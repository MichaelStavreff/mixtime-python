[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "mixtime-rs"
version = "0.1.0"
description = "Rust port of mixtime Gregorian chronon arithmetic"
requires-python = ">=3.9"
license = "MIT"

[tool.maturin]
module-name = "mixtime_rs"
features = ["pyo3/extension-module"]
