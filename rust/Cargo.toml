[package]
name = "mixtime-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of mixtime Gregorian chronon arithmetic"
license = "MIT"

[lib]
name = "mixtime_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["extension-module"] }

[dev-dependencies]
chrono = "0.4.45"
criterion = "0.8.2"
proptest = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "kernel"
harness = false
