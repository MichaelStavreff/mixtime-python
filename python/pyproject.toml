[project]
name = "mixtime"
version = "0.3.0"
description = "Pythonic mixed-granularity time vectors with a Rust Gregorian chronon kernel"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["mixtime-rs>=0.1.0,<0.2", "numpy>=2.0"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
arrow = ["pyarrow>=14"]

[tool.uv.sources]
mixtime-rs = { path = "../rust", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mixtime"]

[dependency-groups]
dev = ["pytest>=8.0", "pandas>=2.0", "pyarrow>=14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
