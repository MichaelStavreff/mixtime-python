[project]
name = "mixtime"
version = "0.1.0"
description = "Python bindings for the Rust port of mixtime Gregorian chronon arithmetic"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["mixtime-rs", "numpy>=2.0"]

[tool.uv.sources]
mixtime-rs = { path = "../rust", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mixtime"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
