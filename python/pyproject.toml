[project]
name = "mixtime"
version = "0.1.1"
description = "Pythonic mixed-granularity time vectors with a Rust Gregorian chronon kernel"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
arrow = ["pyarrow>=14"]

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../rust/Cargo.toml"
python-source = "src"
module-name = "mixtime._rs"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = ["pytest>=8.0", "pandas>=2.0", "pyarrow>=14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
